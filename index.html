  sh.innerHTML='<div class="grab"></div><div class="eyebrow" style="color:var(--gold);margin-bottom:6px">✱ Why it matters</div><h3>'+esc(title)+'</h3><p>'+esc(t)+'</p>';
  document.body.appendChild(bg);document.body.appendChild(sh)}
function closeNote(){["sheet","sheetbg"].forEach(function(i){var x=document.getElementById(i);if(x)x.remove()})}
function vaLadderHTML(){
  var a=S.h["VA-02"],b=S.h["VA-01"],c=S.h["VA-05"],lab,cls,sub;
  if(c==="D"){lab="Holy smokes: about 250";cls="v3";sub="VA-05 flipped. Tsunami territory."}
  else if(b==="D"){lab="2018-style: about 235+";cls="v2";sub="VA-01 flipped. The classic wave test."}
  else if(a==="D"){lab="Solid: 227 to 237";cls="v1";sub="VA-02 flipped. A normal Dem gain, maybe more."}
  else if(a==="R"){lab="No wave so far";cls="v0";sub="Kiggans held VA-02. Dem majority odds drop below 50% (DDHQ)."}
  else{lab="Waiting on Virginia";cls="vn";sub="Virginia counts fast. Results start after 6 CT."}
  function cell(id,size,seat,v){return'<div style="flex:1;padding:8px;border-radius:10px;background:'+(v==="D"?"rgba(61,123,255,.25)":v==="R"?"rgba(255,77,94,.18)":"rgba(255,255,255,.05)")+'"><div class="eyebrow">'+size+'</div><b style="font:800 15px var(--hd)">'+id+'</b><div class="lbl">'+seat+'</div></div>'}
  return'<div class="card"><div class="row1"><span class="eyebrow">Todd\'s Virginia ladder</span><span class="sub">How big is it?</span></div><div class="verdict '+cls+'" style="font-size:24px">'+lab+'</div><div class="sub">'+sub+'</div>'+
   '<div style="display:flex;gap:6px;margin-top:10px">'+cell("VA-02","Small","Luria v Kiggans",a)+cell("VA-01","Medium","~235 seats",b)+cell("VA-05","Large","~250 seats",c)+'</div>'+
   '<div class="note">Tap the VA seats below to set results. Seat estimates from Chuck Todd and DDHQ.</div></div>';
}
function countingHTML(){
  var L=[["Florida","Fast and clean: the best early read of the night."],["Georgia","Metro Atlanta counts last, so early GOP leads are unreliable."],["Michigan","Detroit reports late; early numbers look redder than the result."],["Texas","Big Democratic metros report late."],["Arizona, Nevada, California","Heavy mail voting; days of counting."],["Maine and Alaska","Ranked-choice can take days to weeks."]];
  return'<div class="card"><b>Early returns can mislead</b><div class="note" style="margin-top:4px">Judge margins against expectations and 2024, not who\'s ahead. A red state that won\'t get called is usually good news for Dems.</div>'+
   L.map(function(x){return'<div style="margin-top:8px;font-size:13.5px"><b>'+x[0]+':</b> <span style="color:var(--mute)">'+x[1]+'</span></div>'}).join("")+'</div>';
}
// ---------- events ----------
function after(fn){var prev=snap(),y=window.scrollY;fn();save();render();window.scrollTo(0,y);celebrate(prev,snap(),true)}
document.addEventListener("click",function(){if(SOUND)actx()},true);
document.addEventListener("click",function(e){
  if(e.target.closest("a"))return;
  var as=e.target.closest(".ast");if(as){e.stopPropagation();openNote(as.dataset.note);return}
  if(e.target.closest("#sheetbg,#sheet")){closeNote();return}
  if(e.target.closest("#quote")){QI=(QI+1)%QUOTES.length;var q=document.getElementById("quote");q.outerHTML=quoteHTML();return}
  var t=e.target.closest("[data-s],[data-h],[data-t],[data-k],[data-cc],#reset,#yes,#no,#demo,#demo2,#demo3,#demo4,#snd");if(!t||t.matches("input"))return;
  if(t.id==="snd"){SOUND=!SOUND;try{localStorage.setItem("entrackerSound",SOUND?"1":"0")}catch(e){}if(SOUND){actx();eagle()}var y1=window.scrollY;render();window.scrollTo(0,y1);return}
  if(t.id==="demo3"){flyover();return}
  if(t.id==="demo4"){if(!SOUND){SOUND=true;try{localStorage.setItem("entrackerSound","1")}catch(e){}render()}actx();eagle();setTimeout(fife,1700);return}
  if(t.id==="demo2"){tsunami("house");return}
  if(t.id==="demo"){fireworks("all","med");toast("That is what a big moment looks like","G");return}
  if(t.id==="reset"){document.getElementById("confirm").classList.add("show");return}
  if(t.id==="no"){document.getElementById("confirm").classList.remove("show");return}
  after(function(){
    if(t.dataset.s&&t.dataset.f){var st=S.s[t.dataset.s]=S.s[t.dataset.s]||{};var f=t.dataset.f,v=t.dataset.v;st[f]=st[f]===v?"":v;
      if(f==="call"&&st.call)st.lead=st.call==="R"?"R":"D";st.by="you";st.t=Date.now()}
    else if(t.dataset.cc){S.c[t.dataset.cc]=S.c[t.dataset.cc]===t.dataset.v?"":t.dataset.v}
    else if(t.dataset.h){var c=S.h[t.dataset.h]||"";S.h[t.dataset.h]=c===""?"D":c==="D"?"R":"";S.hu[t.dataset.h]=Date.now()}
    else if(t.dataset.t){S.t[t.dataset.t]=!S.t[t.dataset.t]}
    else if(t.dataset.k!=null){S.k[t.dataset.k]=!S.k[t.dataset.k]}
    else if(t.id==="yes"){S=norm({})}
  });
});
document.addEventListener("change",function(e){
  var t=e.target;
  if(t.matches("input[data-c]")){after(function(){S.c[t.dataset.c]=t.value.trim()});return}
  if(!t.matches("input[data-s]"))return;
  after(function(){var st=S.s[t.dataset.s]=S.s[t.dataset.s]||{};var v=t.value.trim().replace(/^[+]/,"");
    if(t.dataset.f==="m"&&/^-/.test(v)){st.lead="R";v=v.slice(1)}
    if(t.dataset.f==="m"&&v&&!st.lead)st.lead="D";
    st[t.dataset.f]=v;st.by="you";st.t=Date.now()});
});
window.addEventListener("hashchange",function(){readHash();render();window.scrollTo(0,0)});
setInterval(function(){var w=document.getElementById("tlwrap");if(w)w.innerHTML=timelineHTML()},30000);
setInterval(function(){var q=document.getElementById("quote");if(q&&!document.hidden){QI=(QI+1)%QUOTES.length;q.outerHTML=quoteHTML()}},22000);

var REMOTE_AT=0;
function pollRemote(){
  if(!window.fetch)return;
  fetch("state.json?t="+Date.now(),{cache:"no-store"}).then(function(r){if(!r.ok)throw 0;return r.json()}).then(function(R){
    if(!R||!R.updated||R.updated===REMOTE_AT)return;
    var first=REMOTE_AT===0;REMOTE_AT=R.updated;
    if(ART)return; /* on claude.ai the artifact itself is the source of truth */
    if(first&&R.updated<=S.updated&&!/netlify\.app$/.test(location.hostname))return;
    var prev=snap(),y=window.scrollY;S=norm(R);
    try{localStorage.setItem("entracker26",JSON.stringify(S))}catch(e){}
    render();window.scrollTo(0,y);if(!first)celebrate(prev,snap(),false);storeSnap();
  }).catch(function(){});
}
readHash();render();
setTimeout(pollRemote,1500);setInterval(pollRemote,60000);
var prevSnap=getSnap(),curSnap=snap();
if(prevSnap)setTimeout(function(){celebrate(prevSnap,curSnap,false)},700);
storeSnap();
try{var sy=sessionStorage.getItem("entrackerScroll");if(sy){sessionStorage.removeItem("entrackerScroll");setTimeout(function(){window.scrollTo(0,parseFloat(sy))},60)}}catch(e){}
})();
